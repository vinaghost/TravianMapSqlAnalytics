# REGISTRY_HOST
# REGISTRY_USERNAME
# REGISTRY_PASSWORD

name: Build and deploy
permissions:
  contents: read
on:
  workflow_dispatch:
    inputs:
      webmvc:
        description: 'Disable Web MVC build'
        type: boolean
      webapi:
        description: 'Disable Web API build'
        type: boolean
jobs:
  webmvc:
    runs-on: ubuntu-latest
    if: github.event.inputs.webmvc == 'false'
    permissions:
      contents: read
      packages: write
    steps:     
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
     
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Checkout
        uses: actions/checkout@v7      

      - name: Build and push update image
        uses: docker/build-push-action@v7
        with:
          platforms: linux/arm64
          file: ./WebMVC/Dockerfile
          context: .
          push: true
          tags: ${{ secrets.REGISTRY_HOST }}/webmvc:latest
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/webmvc:cache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/webmvc:cache,mode=max,compression=zstd,oci-mediatypes=true,image-manifest=true

  webapi:
    runs-on: ubuntu-latest
    if: github.event.inputs.webapi == 'false'
    permissions:
      contents: read
      packages: write
    steps:     
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
     
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Checkout
        uses: actions/checkout@v7      

      - name: Build and push update image
        uses: docker/build-push-action@v7
        with:
          platforms: linux/arm64
          file: ./WebAPI/Dockerfile
          context: .
          push: true
          tags: ${{ secrets.REGISTRY_HOST }}/webapi:latest
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/webapi:cache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/webapi:cache,mode=max,compression=zstd,oci-mediatypes=true,image-manifest=true
